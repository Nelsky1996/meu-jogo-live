<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TikTok Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            /* Fundo transparente para encaixar limpo no OBS / Live Studio */
            background-color: rgba(0, 0, 0, 0);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        /* Notificação superior de presentes */
        #alert-box {
            background: linear-gradient(135deg, #fe2c55, #ff0050);
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 800;
            box-shadow: 0 8px 25px rgba(254, 44, 85, 0.6);
            transform: translateY(-120px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255, 255, 255, 0.4);
            z-index: 100;
        }

        #alert-box.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Placar Top Likes */
        #ranking-panel {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px 18px;
            width: 220px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        #ranking-panel h3 {
            font-size: 0.9rem;
            color: #25f4ee;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .ranking-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ranking-row:last-child {
            border-bottom: none;
        }

        .ranking-user {
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ranking-score {
            color: #fe2c55;
            font-weight: 700;
        }

        /* Área central dos vídeos */
        #stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 30px;
        }

        .character-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Moldura redonda para os vídeos */
        .video-wrapper {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #3f4458;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .character-tag {
            margin-top: 12px;
            background: rgba(20, 20, 28, 0.9);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        .character-tag span {
            display: block;
            font-size: 0.75rem;
            color: #a1a1aa;
            font-weight: 500;
        }

        /* Efeito de destaque no vídeo quando acionado */
        .active-trigger {
            transform: scale(1.18);
            border-color: #25f4ee !important;
            box-shadow: 0 0 30px rgba(37, 244, 238, 0.8);
        }
    </style>
</head>
<body>

    <div id="alert-box">🎁 Novo Presente!</div>

    <div id="ranking-panel">
        <h3>🏆 Top Likes</h3>
        <div id="ranking-list">
            <div class="ranking-row">
                <span class="ranking-user">A aguardar...</span>
                <span class="ranking-score">0</span>
            </div>
        </div>
    </div>

    <div id="stage">
        <!-- Bebé 1 -->
        <div class="character-card" id="card-1">
            <div class="video-wrapper" id="wrap-1">
                <video id="video-1" src="/assets/bebe1.mp4" playsinline muted loop></video>
            </div>
            <div class="character-tag">
                Bebé 1
                <span>Rosa = Comer</span>
            </div>
        </div>

        <!-- Bebé 2 -->
        <div class="character-card" id="card-2">
            <div class="video-wrapper" id="wrap-2">
                <video id="video-2" src="/assets/bebe2.mp4" playsinline muted loop></video>
            </div>
            <div class="character-tag">
                Bebé 2
                <span>Sorvete = Dançar</span>
            </div>
        </div>

        <!-- Bebé 3 -->
        <div class="character-card" id="card-3">
            <div class="video-wrapper" id="wrap-3">
                <video id="video-3" src="/assets/bebe3.mp4" playsinline muted loop></video>
            </div>
            <div class="character-tag">
                Bebé 3
                <span>Outros = Susto</span>
            </div>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('alert-box');
        const rankingList = document.getElementById('ranking-list');

        // Garante que os vídeos arrancam pausados no início
        const videos = {
            1: document.getElementById('video-1'),
            2: document.getElementById('video-2'),
            3: document.getElementById('video-3')
        };

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        let socket;

        function connect() {
            socket = new WebSocket(`${protocol}//${window.location.host}`);

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'TRIGGER_BABY') {
                    playBabyReaction(data.target, data.donor, data.giftName, data.repeatCount);
                } else if (data.type === 'UPDATE_RANKING') {
                    updateRanking(data.ranking);
                }
            };

            socket.onclose = () => setTimeout(connect, 2000);
        }

        function playBabyReaction(targetId, donor, gift, count) {
            const vid = videos[targetId];
            const wrap = document.getElementById(`wrap-${targetId}`);
            if (!vid || !wrap) return;

            // Mostra o alerta superior
            alertBox.innerHTML = `🎁 <strong>@${donor}</strong> enviou <strong>${gift} x${count}</strong>!`;
            alertBox.classList.add('show');
            clearTimeout(window.alertTimer);
            window.alertTimer = setTimeout(() => alertBox.classList.remove('show'), 3500);

            // Toca o vídeo correspondente e ativa a moldura iluminada
            wrap.classList.add('active-trigger');
            vid.currentTime = 0;
            vid.play().catch(() => {});

            clearTimeout(wrap.animTimer);
            wrap.animTimer = setTimeout(() => {
                wrap.classList.remove('active-trigger');
                vid.pause();
                vid.currentTime = 0;
            }, 3500);
        }

        function updateRanking(ranking) {
            if (!ranking || ranking.length === 0) return;
            rankingList.innerHTML = ranking.map((item, index) => `
                <div class="ranking-row">
                    <span class="ranking-user">${index + 1}. @${item.user}</span>
                    <span class="ranking-score">${item.count}</span>
                </div>
            `).join('');
        }

        connect();
    </script>
</body>
</html>
