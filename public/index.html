<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creche Interativa TikTok</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            /* Fundo totalmente transparente para mostrar a imagem que colocar no OBS por trás */
            background-color: transparent;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 20px;
        }

        .test-panel {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 5px; z-index: 9999;
        }
        .test-btn {
            background: #ffffff; border: none; padding: 6px;
            font-size: 11px; font-weight: 900; border-radius: 6px; cursor: pointer;
        }

        /* ================= BOLHAS DE LIKES ================= */
        .ranking-title {
            font-family: 'Fredoka One', cursive;
            font-size: 32px; text-align: center; margin-bottom: 20px;
            color: #00f2fe; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.8), 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
        }
        
        .bubbles-container {
            display: flex;
            justify-content: center;
            align-items: flex-end; 
            gap: 20px;
            min-height: 220px; 
            position: relative;
            width: 100%;
        }

        .bubble {
            border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset -8px -8px 20px rgba(0,0,0,0.4), inset 8px 8px 20px rgba(255,255,255,0.5);
            text-align: center; overflow: hidden;
            border: 3px solid rgba(255,255,255,0.8);
            animation: floatBubble 3s ease-in-out infinite alternate;
        }

        @keyframes floatBubble {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-20px); }
        }

        /* ================= PALCO (AMBIENTE REAL) ================= */
        .stage {
            display: flex; 
            justify-content: center; 
            gap: 5px; /* Bebés bem próximos uns dos outros */
            width: 100%; 
            max-width: 950px;
            margin-top: 30px;
        }

        /* O '.crib' agora é apenas um espaço invisível, sem cartão branco */
        .crib {
            width: 280px; 
            height: 420px;
            background: transparent; /* Sem fundo */
            border: none; /* Sem borda */
            box-shadow: none; /* Sem sombra da caixa */
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding: 10px; position: relative;
            animation: gentleRock 4s ease-in-out infinite alternate;
            z-index: 1; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* O SALTO PARA A FRENTE NO AMBIENTE */
        .crib.crib-active {
            z-index: 9999 !important;
            transform: scale(1.35) translateY(-30px) !important;
            animation: none !important; 
            /* Um brilho forte por trás do bebé em vez de borda vermelha */
            filter: drop-shadow(0 0 30px rgba(255, 0, 80, 0.8));
        }

        #crib-1 { animation-delay: 0s; }
        #crib-2 { animation-delay: -1.5s; }
        #crib-3 { animation-delay: -3s; }

        @keyframes gentleRock {
            0% { transform: rotate(-1.5deg) translateY(0); }
            100% { transform: rotate(1.5deg) translateY(-5px); }
        }

        /* ÍCONES DOS PRESENTES (Ainda flutuam por cima) */
        .gift-icon-display {
            position: absolute;
            top: -20px; 
            font-size: 70px; 
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5));
            z-index: 10;
            animation: pulseGift 1.5s infinite alternate ease-in-out;
        }
        @keyframes pulseGift {
            0% { transform: scale(1) rotate(-5deg); }
            100% { transform: scale(1.15) rotate(5deg); }
        }

        /* SOMBRA NO CHÃO: Faz o bebé parecer estar pousado no ambiente */
        .baby-container {
            width: 100%; height: 280px;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .baby-canvas {
            width: 100%; height: 100%; object-fit: contain;
            /* Sombra projetada no chão imaginário */
            filter: drop-shadow(0 25px 15px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }

        video.source-video { display: none; }

        /* TEXTOS FLUTUANTES COM CONTORNO GROSSO (Lê-se em qualquer fundo) */
        .info-card {
            text-align: center; width: 100%;
            background: transparent; /* Sem fundo branco */
            padding: 5px;
            margin-top: 10px;
        }
        .baby-name { 
            font-size: 28px; 
            font-weight: 900; 
            color: #ffffff; 
            /* Contorno preto super forte */
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 8px 15px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }
        .gift-hint { 
            font-size: 18px; 
            font-weight: 900; 
            color: #ffeb3b; 
            background: rgba(0,0,0,0.6); 
            border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 20px; 
            padding: 4px 15px; 
            display: inline-block; 
            margin-top: 8px; 
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        /* ANIMAÇÕES DAS AÇÕES */
        .anim-eat { animation: turboEat 0.4s infinite alternate ease-in-out !important; }
        @keyframes turboEat { 0% { transform: scale(1) translateY(0); } 100% { transform: scale(1.15) translateY(12px); } }

        .anim-dance { animation: breakdance 0.4s infinite alternate ease-in-out !important; }
        @keyframes breakdance { 0% { transform: translateY(0) rotate(-15deg) scale(1.1); } 100% { transform: translateY(-20px) rotate(15deg) scale(1.1); } }

        .anim-scare { animation: suddenShock 0.8s cubic-bezier(.25,1.75,.35,.8) !important; }
        @keyframes suddenShock { 0% { transform: scale(1); } 35% { transform: translateY(-40px) scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div>
        <div class="ranking-title">🫧 ESTOURO DE LIKES 🫧</div>
        <div class="bubbles-container" id="bubble-track">
            <div style="color:white; font-size:24px; font-weight:900; align-self: center; text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;">
                Dê dois toques na tela para encher a sua bolha!
            </div>
        </div>
    </div>

        <button class="test-btn" onclick="triggerAction(3, 'scare')">🫶 Testar Coração</button>

            <div class="info-card">
                <div class="baby-name">Esfomeado</div>
                <div class="gift-hint">Mande Rosa</div>
            </div>
        </div>

        <!-- Bebé 2 -->
        <div class="crib" id="crib-2">
            <div class="gift-icon-display">🍦</div>
            <div class="baby-container">
                <video id="vid-2" class="source-video" src="/assets/bebe2.mp4" playsinline preload="auto" crossorigin="anonymous"></video>
                <canvas id="canvas-2" class="baby-canvas"></canvas>
            </div>
            <div class="info-card">
                <div class="baby-name">Dançarino</div>
                <div class="gift-hint">Mande Sorvete</div>
            </div>
        </div>

        <!-- Bebé 3 -->
        <div class="crib" id="crib-3">
            <div class="gift-icon-display">🫶</div>
            <div class="baby-container">
                <video id="vid-3" class="source-video" src="/assets/bebe3.mp4" playsinline preload="auto" crossorigin="anonymous"></video>
                <canvas id="canvas-3" class="baby-canvas"></canvas>
            </div>
            <div class="info-card">
                <div class="baby-name">Dormindo</div>
                <div class="gift-hint">Mande Coração</div>
            </div>
        </div>
    </div>
