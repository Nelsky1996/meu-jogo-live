<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creche Interativa TikTok</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: transparent;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 20px;
            position: relative;
        }

        /* Camada de partículas flutuantes de fundo */
        #ambient-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .test-panel {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 5px; z-index: 9999;
        }
        .test-btn {
            background: #ffffff; border: none; padding: 6px;
            font-size: 11px; font-weight: 900; border-radius: 6px; cursor: pointer;
            transition: transform 0.1s;
        }
        .test-btn:active { transform: scale(0.95); }

        /* ================= ARENA DE BATALHA DE BOLHAS ================= */
        .ranking-title {
            font-family: 'Fredoka One', cursive;
            font-size: 34px; text-align: center; margin-bottom: 5px;
            color: #00f2fe; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.8), 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            animation: pulseTitle 2s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes pulseTitle {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(0,242,254,0.4)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 15px rgba(0,242,254,0.9)); }
        }

            position: relative;
            width: 100%;
